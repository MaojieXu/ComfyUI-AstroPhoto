[project]
name = "ComfyUI_AstroPhoto"
version = "0.0.1"
description = "An astrophotography toolkit for ComfyUI featuring astronomical image asset management, established astronomy software exposed as workflow nodes, an image-processing knowledge base, and MCP interfaces for workflow creation and execution by external AI agents."
authors = [
  {name = "MaojieXu", email = "maojiexu16@gmail.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.11"
classifiers = []
dependencies = [
    "astrophoto-mcp==0.0.1",
]



[dependency-groups]
dev = [
    "aiohttp>=3.9,<4", # supplied by ComfyUI at runtime; needed by isolated API tests
    "pytest>=8,<9",
    "pathspec>=0.12,<1",
    "tomli-w>=1,<2",
    "ruff>=0.11,<1",
    "comfy-cli>=1.16,<2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp"]

[tool.uv.sources]
astrophoto-mcp = { workspace = true }

[project.urls]
Repository = "https://github.com/MaojieXu/ComfyUI-AstroPhoto"
BugTracker = "https://github.com/MaojieXu/ComfyUI-AstroPhoto/issues"
Documentation = "https://github.com/MaojieXu/ComfyUI-AstroPhoto/wiki"


[tool.comfy]
PublisherId = "MaojieXu"
DisplayName = "ComfyUI-AstroPhoto"
Icon = ""
Tags = []
Repository = "https://github.com/MaojieXu/ComfyUI-AstroPhoto"
includes = ["js", "locales"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests/nodes",
    "tests/packaging",
    "tests/backend",
    "tests/integration",
]
markers = ["host: requires a real running ComfyUI host; opt in with COMFYUI_TEST_URL"]
addopts = "--import-mode=importlib --confcutdir=tests"
pythonpath = ["."]
norecursedirs = ["reference", "frontend", "mcp", ".venv", "dist"]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["nodes", "mcp/src", "tests"]
target-version = "py311"
extend-exclude = ["reference", ".agents", ".codegraph"]

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
